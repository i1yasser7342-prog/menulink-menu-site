  <style>:root{--ink:#383838;--muted:#707066;--cream:#f8f9eb;--paper:#f8f9eb;--green:#778f41;--lime:#c9df81;--line:#d9dccb;--accent:#f37143;--shadow:0 18px 50px rgba(24,45,36,.12)}

22px solid var(--green);border-left:0;border-radius:0 70px 70px 0;right:-66px;top:72px}.cup span{position:absolute;width:210px;height:24px;border-radius:50%;background:#efe8d9;left:20px;top:-10px;border:10px solid #fff}.bean{position:absolute;width:28px;height:40px;border-radius:50%;background:#81513d;transform:rotate(28deg)}.bean:after{content:"";position:absolute;width:2px;height:28px;background:#b78669;left:13px;top:6px;border-radius:2px}.bean-a{left:12%;bottom:21%;transform:rotate(52deg)}.bean-b{left:72%;bottom:15%}.bean-c{left:78%;bottom:52%;transform:rotate(-20deg)}.category-wrap{position:sticky;top:0;z-index:10;background:rgba(251,250,246,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}.categories{display:flex;gap:10px;overflow-x:auto;padding:14px 0;scrollbar-width:none}.categories::-webkit-scrollbar{display:none}.category{white-space:nowrap;border:1px solid var(--line);background:transparent;border-radius:999px;padding:11px 17px;font:600 14px inherit;cursor:pointer;transition:.2s}.category.active,.category:hover{background:var(--green);color:#fff;border-color:var(--green)}.menu-shell{padding:78px 0 110px}.section-intro{display:flex;align-items:end;justify-content:space-between;margin-bottom:58px;border-bottom:1px solid var(--line);padding-bottom:26px}.section-intro span{color:var(--muted);font-size:14px}.section-intro h2{font-size:clamp(35px,5vw,58px);margin:0;letter-spacing:-1px}.menu-section{scroll-margin-top:90px;margin-bottom:96px}.menu-heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}.menu-heading h3{font-size:34px;margin:0}.menu-heading span{width:46px;height:46px;border-radius:50%;background:var(--cream);display:grid;place-items:center;font-size:21px}.items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.item{display:grid;grid-template-columns:1fr auto;gap:10px;padding:23px 24px;border:1px solid var(--line);border-radius:18px;background:#fff;transition:.22s}.item:hover{transform:translateY(-3px);box-shadow:0 12px 34px rgba(24,45,36,.08);border-color:#b8b4aa}.item h4{margin:0 0 8px;font-size:18px}.item p{margin:0;color:var(--muted);font-size:13px;line-height:1.7}.price{font-size:18px;font-weight:800;color:var(--green);direction:rtl}.badge{display:inline-block;margin-top:10px;font-size:11px;background:var(--lime);padding:4px 8px;border-radius:999px;color:var(--green);font-weight:700}footer{background:var(--green);color:#fff;padding:60px 0}.footer-inner{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:start}.footer-inner strong{font-size:32px}.footer-inner p{opacity:.7}.footer-links{display:flex;gap:22px}.footer-inner small{grid-column:1/-1;opacity:.5;border-top:1px solid rgba(255,255,255,.18);padding-top:24px}.to-top{position:fixed;left:20px;bottom:20px;width:48px;height:48px;border-radius:50%;border:0;background:var(--green);color:#fff;font-size:20px;box-shadow:var(--shadow);cursor:pointer;opacity:0;pointer-events:none;transition:.2s;z-index:20}.to-top.show{opacity:1;pointer-events:auto}
@media(max-width:800px){.hero{min-height:720px}.hero-content{padding-top:40px}.hero h1{font-size:58px}.hero-art{width:88%;height:48%;left:-18%;bottom:-15px}.sun{width:380px;height:380px}.cup{width:180px;height:220px;left:29%;bottom:12%}.cup:before{font-size:25px;top:72px}.cup:after{width:58px;height:72px;border-width:16px;right:-46px}.cup span{width:150px;height:20px;left:15px}.items{grid-template-columns:1fr}.section-intro{display:block}.section-intro span{display:block;margin-bottom:8px}.section-intro h2{font-size:42px}.menu-heading h3{font-size:28px}.menu-shell{padding-top:55px}.footer-inner{grid-template-columns:1fr}.footer-links{justify-content:flex-start}.footer-inner small{grid-column:auto}}
@media(max-width:430px){.shell{width:min(100% - 24px,1120px)}.topbar{height:82px}.hero h1{font-size:49px;letter-spacing:-2px}.hero-text{font-size:16px}.hero-art{width:105%;left:-32%}.item{padding:20px}.menu-section{margin-bottom:72px}}
</style>
</head>
<body>
  <header class="hero">
    <nav class="topbar shell">
      <a class="brand" href="#top" aria-label="العودة للأعلى">
        <span class="brand-mark">P</span>
        <span class="brand-copy"><strong>prodiet</strong><small>HEALTHY FOOD</small></span>
      </a>
      <button class="lang" type="button" id="langButton" aria-label="تغيير اللغة">EN</button>
    </nav>

    <div class="hero-content shell" id="top">
      <p class="hero-note">تغذية متوازنة بطعم تحبه</p>
      <h1>اختيارك الصحي<br>أصبح ألذ</h1>

      <a class="scroll-cta" href="#menu">استكشف المنيو <span>↓</span></a>
    </div>
    <div class="hero-art" aria-hidden="true">
      <div class="sun"></div>
      <div class="cup"><span></span></div>
      <div class="bean bean-a"></div><div class="bean bean-b"></div><div class="bean bean-c"></div>
    </div>
  </header>

  <main id="menu">
    <div class="category-wrap">
      <div class="categories shell" id="categories" aria-label="تصنيفات المنيو"></div>
    </div>

    <section class="menu-shell shell">
      <div class="section-intro">
        <span id="sectionCount">8 أقسام</span>
        <h2>اختر مزاجك اليوم</h2>
      </div>
      <div id="menuSections"></div>
    </section>
  </main>

  <footer>
    <div class="shell footer-inner">
      <div><strong>prodiet</strong><p>توازن يصنع يومك.</p></div>
      <div class="footer-links"><a href="#top">الرئيسية</a><a href="tel:+966500000000">تواصل معنا</a></div>
      <small>© 2026 جميع الحقوق محفوظة</small>
    </div>
  </footer>

  <button class="to-top" id="toTop" aria-label="العودة للأعلى">↑</button>
  <script>const SUPABASE_URL = 'https://snntyrevgtyjjwnsdsrj.supabase.co';
const SUPABASE_KEY = 'sb_publishable_CVsIAE1KndWtqYLcEjAEDg_YhCQfrmZ';

const fallbackMenu = [
  {id:'drip',name:'القهوة المقطرة',icon:'◌',items:[['V60 إثيوبي','قهوة زهرية بنكهة البرغموت والخوخ','22'],['V60 كولومبي','كراميل، كاكاو، وفواكه حمراء','21'],['كولد برو','استخلاص بارد لمدة 18 ساعة','20','الأكثر طلباً'],['كيمكس لشخصين','استخلاص نقي ومتوازن','34']]},
  {id:'espresso',name:'إسبريسو',icon:'●',items:[['إسبريسو','جرعة مركزة ومتوازنة','12'],['أمريكانو','إسبريسو وماء ساخن','14'],['كابتشينو','إسبريسو وحليب مبخر','18'],['فلات وايت','قوام مخملي ونكهة قهوة واضحة','19','مميز']]},
  {id:'matcha',name:'ماتشا',icon:'✦',items:[['ماتشا لاتيه','ماتشا يابانية مع الحليب','22'],['ماتشا فراولة','فراولة طازجة وماتشا كريمية','25','جديد'],['ماتشا جوز الهند','حليب جوز هند ولمسة فانيلا','24'],['ماتشا صافية','ماتشا وماء فقط','18']]},
  {id:'breakfast',name:'الفطور الصحي',icon:'☼',items:[['توست أفوكادو','أفوكادو، فيتا، وبيض مسلوق','29'],['جرانولا بول','زبادي يوناني، فواكه، وعسل','27'],['ساندويتش حلوم','حلوم مشوي وخضار طازجة','26'],['بيض تركي','لبنة، بيض، وزبدة بابريكا','31','اختيار الشيف']]},
  {id:'daily',name:'قهوة اليوم',icon:'◇',items:[['قهوة اليوم — صغير','اختيار يومي من محاصيلنا','10'],['قهوة اليوم — كبير','اختيار يومي من محاصيلنا','14'],['آيس كوفي اليوم','قهوة اليوم على الثلج','16'],['ترمس قهوة','يكفي 4 إلى 5 أشخاص','48']]},
  {id:'drinks',name:'المشروبات',icon:'≈',items:[['شاي خوخ مثلج','خوخ، شاي أسود، وليمون','18'],['ليمون نعناع','ليمون طازج ونعناع','17'],['موهيتو توت','توت مشكل وليمون','20'],['مياه غازية','زجاجة 330 مل','9']]},
  {id:'dessert',name:'الحلويات',icon:'♡',items:[['سان سباستيان','تشيز كيك مخبوزة يومياً','26','الأكثر طلباً'],['كيكة تمر','تمر وقرفة وصوص كراميل','24'],['كرواسون لوز','زبدة فرنسية وحشوة لوز','19'],['كوكي شوكولاتة','شوكولاتة داكنة وملح بحري','15']]},
  {id:'extras',name:'محاصيلنا والإضافات',icon:'＋',items:[['محصول إثيوبي 250 جم','مناسب للترشيح','65'],['محصول كولومبي 250 جم','متوازن وحلو','62'],['حليب بديل','شوفان أو جوز هند','4'],['نكهة إضافية','فانيلا، كراميل، بندق','3']]}
];

async function loadMenu() {
  const headers = { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` };
  const [categoriesResponse, itemsResponse] = await Promise.all([
    fetch(`${SUPABASE_URL}/rest/v1/menu_categories?select=id,name_ar,icon,sort_order&is_active=eq.true&order=sort_order.asc`, { headers }),
    fetch(`${SUPABASE_URL}/rest/v1/menu_items?select=category_id,name_ar,description_ar,price,badge_ar,sort_order&is_active=eq.true&order=sort_order.asc`, { headers })
  ]);

  if (!categoriesResponse.ok || !itemsResponse.ok) throw new Error('تعذر تحميل بيانات المنيو');

  const categories = await categoriesResponse.json();
  const items = await itemsResponse.json();
  return categories.map(category => ({
    id: category.id,
    name: category.name_ar,
    icon: category.icon,
    items: items
      .filter(item => item.category_id === category.id)
      .map(item => [item.name_ar, item.description_ar || '', Number(item.price).toString(), item.badge_ar || undefined])
  }));
}

function renderMenu(menu) {
  const categories = document.getElementById('categories');
  const sections = document.getElementById('menuSections');
  categories.innerHTML = '';
  sections.innerHTML = '';
  document.getElementById('sectionCount').textContent = `${menu.length} أقسام`;

  menu.forEach((section, index) => {
    const button = document.createElement('button');
    button.className = `category${index === 0 ? ' active' : ''}`;
    button.textContent = section.name;
    button.onclick = () => document.getElementById(section.id).scrollIntoView({ behavior: 'smooth' });
    categories.appendChild(button);

    const element = document.createElement('section');
    element.className = 'menu-section';
    element.id = section.id;
    element.innerHTML = `<div class="menu-heading"><h3>${section.name}</h3><span>${section.icon}</span></div><div class="items">${section.items.map(item => `<article class="item"><div><h4>${item[0]}</h4><p>${item[1]}</p>${item[3] ? `<span class="badge">${item[3]}</span>` : ''}</div><div class="price">${item[2]} ر.س</div></article>`).join('')}</div>`;
    sections.appendChild(element);
  });

  const buttons = [...document.querySelectorAll('.category')];
  const observer = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (!entry.isIntersecting) return;
      const index = menu.findIndex(section => section.id === entry.target.id);
      buttons.forEach((button, buttonIndex) => button.classList.toggle('active', buttonIndex === index));
      buttons[index]?.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
    });
  }, { rootMargin: '-35% 0px -55% 0px' });
  document.querySelectorAll('.menu-section').forEach(section => observer.observe(section));
}

loadMenu().then(renderMenu).catch(error => {
  console.warn(error);
  renderMenu(fallbackMenu);
});

const toTop = document.getElementById('toTop');
window.addEventListener('scroll', () => toTop.classList.toggle('show', scrollY > 500));
toTop.onclick = () => scrollTo({ top: 0, behavior: 'smooth' });
document.getElementById('langButton').onclick = () => alert('يمكن إضافة النسخة الإنجليزية من لوحة الإدارة لاحقًا.');
</script>
</body>
