@font-face{font-family:"ThmanyahSans";src:url("https://raw.githubusercontent.com/i1yasser7342-prog/menulink-menu-site/main/current/fonts/thmanyah/thmanyahsans-Regular.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"ThmanyahSans";src:url("https://raw.githubusercontent.com/i1yasser7342-prog/menulink-menu-site/main/current/fonts/thmanyah/thmanyahsans-Medium.woff2") format("woff2");font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:"ThmanyahSans";src:url("https://raw.githubusercontent.com/i1yasser7342-prog/menulink-menu-site/main/current/fonts/thmanyah/thmanyahsans-Bold.woff2") format("woff2");font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:"ThmanyahSans";src:url("https://raw.githubusercontent.com/i1yasser7342-prog/menulink-menu-site/main/current/fonts/thmanyah/thmanyahsans-Black.woff2") format("woff2");font-weight:800 900;font-style:normal;font-display:swap}
:root{--ink:#383838;--muted:#707066;--paper:#f8f9eb;--panel:#fff;--green:#778f41;--green-dark:#5f7434;--lime:#c9df81;--line:#d9dccb;--accent:#f37143;--shadow:0 10px 26px rgba(24,45,36,.12);--cw:clamp(156px,calc((100vw - 60px)/2),177px)}
*{box-sizing:border-box}
html{scroll-behavior:auto}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"ThmanyahSans","Tajawal",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input{font-family:inherit}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
.shell{width:min(1200px,calc(100% - 24px));margin-inline:auto}
[hidden]{display:none!important}

.top-banner img{width:100%;height:clamp(110px,22vw,260px);object-fit:cover}

.site-head{position:sticky;top:0;z-index:50;background:rgba(248,249,235,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.head-row{height:72px;display:flex;align-items:center;justify-content:space-between;position:relative}
.brand{display:flex;align-items:center;gap:12px}
.brand-mark{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--green);color:#fff;font-size:22px;font-weight:800}
.brand-copy{display:flex;flex-direction:column;line-height:1}
.brand-copy strong{font-size:20px}
.brand-copy small{font-size:9px;letter-spacing:2.4px;margin-top:6px;color:var(--muted)}
.head-actions{display:flex;align-items:center;gap:10px}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:16px;font-weight:700;cursor:pointer;display:grid;place-items:center}
.icon-btn:hover{background:var(--lime)}
.menu-btn{display:none}
.tabs{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:2px 0 14px}
.tab{border:0;background:transparent;border-radius:999px;padding:10px 20px;font-weight:700;font-size:15px;color:var(--ink);cursor:pointer;transition:background .2s,color .2s;white-space:nowrap}
.tab:hover{background:rgba(201,223,129,.45)}
.tab.active{background:var(--green);color:#fff}
.drawer{position:absolute;top:72px;inset-inline:0;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:8px;display:flex;flex-direction:column;z-index:60}
.drawer .tab{text-align:start;border-radius:12px;padding:12px 16px;font-size:16.8px}

.search{position:relative;margin:22px auto 6px;max-width:760px}
.search input{width:100%;height:56px;border:1px solid var(--line);border-radius:18px;background:#fff;padding:0 50px 0 18px;font:500 16px inherit;color:var(--ink);outline:none}
.search input:focus{border-color:var(--green)}
.search svg{position:absolute;right:18px;top:19px;width:18px;height:18px;color:var(--green);pointer-events:none}

.welcome{max-width:760px;margin:16px auto 0;text-align:center}
.pill{display:inline-block;background:var(--lime);color:var(--green-dark);font-weight:700;font-size:13px;padding:6px 14px;border-radius:999px}
.tag-card{margin-top:12px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px 18px}
.tag-card h1{margin:0 0 6px;font-size:clamp(22px,4vw,30px);line-height:1.2;letter-spacing:-.5px}
.tag-card p{margin:0;color:var(--muted);font-size:14px;line-height:1.8}
.strip{margin-top:26px}
.strip-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.strip h2{margin:0;font-size:20px;font-weight:800}
.strip-head a{font-size:13px;font-weight:700;color:var(--green-dark)}
.scroller{display:flex;gap:15px;overflow-x:auto;padding:4px 2px 16px;scrollbar-width:thin}
.scroller .card{flex:none;width:204px}

.cat-view h2{margin:26px 0 14px;font-size:20px;font-weight:800;text-align:start}
.grid{display:grid;grid-template-columns:repeat(2,var(--cw));justify-content:center;gap:22px 10px}

.card{position:relative;aspect-ratio:100/141;perspective:900px;cursor:pointer;outline:none}
.card-inner{position:absolute;inset:0;transition:transform .55s cubic-bezier(.3,.7,.2,1);transform-style:preserve-3d}
.card.flipped .card-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 4px 14px rgba(24,45,36,.07);padding:7px;display:flex;flex-direction:column;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.card:focus-visible .face.front{border-color:var(--green);box-shadow:0 0 0 3px rgba(119,143,65,.3)}
.back{transform:rotateY(180deg);padding:12px;background:linear-gradient(180deg,#fff,#f4f7e6);text-align:start;overflow:auto}
.media{position:relative;aspect-ratio:4/5;width:100%;border-radius:10px;overflow:hidden;background:var(--paper);flex:none}
.media img,.ph{width:100%;height:100%;object-fit:cover}
.ph{display:grid;place-items:center;font-size:28px;color:var(--green);background:radial-gradient(circle at 30% 30%,rgba(201,223,129,.5),transparent 60%),var(--paper)}
.en-name{position:absolute;top:8px;inset-inline-end:8px;max-width:70%;font-size:10px;font-weight:700;letter-spacing:.3px;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.7);direction:ltr;text-align:left;line-height:1.2}
.name{position:absolute;inset-inline:0;bottom:0;padding:26px 9px 8px;background:linear-gradient(0deg,rgba(15,22,10,.72),rgba(15,22,10,.3) 60%,transparent);color:#fff;font-weight:800;font-size:15px;line-height:1.25;text-shadow:0 1px 6px rgba(0,0,0,.7)}
.badge{position:absolute;top:8px;inset-inline-start:8px;background:linear-gradient(135deg,var(--lime),#a7c257);color:var(--green-dark);font-size:10px;font-weight:800;padding:3px 9px;border-radius:999px;z-index:2}
.price-row{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;min-height:0}
.price-row .num{font-weight:900;font-size:clamp(15px,2.2vw,18px);color:var(--accent)}
.chip{font-size:9px;font-weight:700;color:var(--green-dark);border:1px solid var(--green);border-radius:6px;padding:0 4px;line-height:14px}
.back h3{margin:0 0 6px;font-size:16px;line-height:1.3}
.back p{margin:0 0 8px;color:var(--muted);font-size:12.5px;line-height:1.7}
.back .cat{display:inline-block;font-size:11px;font-weight:700;color:var(--green-dark);background:var(--lime);padding:2px 9px;border-radius:999px;margin-bottom:8px}
.back .price-back{margin-top:auto;font-weight:900;color:var(--accent);font-size:17px}
.back .hint{margin-top:6px;font-size:10.5px;color:var(--muted)}

.empty{max-width:420px;margin:60px auto;text-align:center;color:var(--muted);line-height:1.9}
.empty b{display:block;color:var(--ink);font-size:20px;margin-bottom:6px}

footer{margin-top:60px;background:var(--green);color:#fff;padding:36px 0 30px}
.foot{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.foot strong{font-size:24px}
.foot p{margin:0;opacity:.8;font-size:14px}
.foot a{font-weight:700;opacity:.95}
.foot small{opacity:.6;font-size:12px;margin-top:6px}

.to-top{position:fixed;left:16px;bottom:16px;width:44px;height:44px;border-radius:50%;border:0;background:var(--green);color:#fff;font-size:18px;box-shadow:var(--shadow);cursor:pointer;opacity:0;pointer-events:none;transition:.2s;z-index:40}
.to-top.show{opacity:1;pointer-events:auto}

@media(max-width:399px){:root{--cw:156px}}
@media(min-width:400px){.grid{gap:26px 12px}}
@media(min-width:400px) and (max-width:700px){:root{--cw:177px}}
@media(min-width:701px){
  :root{--cw:clamp(177px,calc(13.2vw + 76px),238px)}
  .grid{grid-template-columns:repeat(3,var(--cw));gap:12px}
  .scroller .card{width:220px}
}
@media(min-width:1000px){.grid{gap:24px}}
@media(max-width:700px){
  .menu-btn{display:grid}
  .tabs{display:none}
}
@media(prefers-reduced-motion:reduce){.card-inner{transition:none}}

.top-banner{background:#383838;line-height:0}
.top-banner img{width:100%;height:auto;max-height:clamp(120px,26vw,320px);object-fit:cover;display:block}

/* ===== UX polish: touch, motion, navigation ===== */
html{-webkit-text-size-adjust:100%}
a,button,.card{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
:focus-visible{outline:3px solid rgba(119,143,65,.55);outline-offset:2px;border-radius:8px}
.card{transition:transform .18s ease}
.card:active{transform:scale(.975)}
@media(hover:hover){.card:hover .face.front{box-shadow:0 10px 26px rgba(24,45,36,.16)}.card:hover{transform:translateY(-3px)}}
.tab{min-height:44px;display:inline-flex;align-items:center}
.icon-btn{width:44px;height:44px}
.scroller{scroll-snap-type:x proximity;scroll-padding-inline:2px;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.scroller .card{scroll-snap-align:start}
.strip{position:relative}
.strip-nav{position:absolute;top:calc(50% - 8px);width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:#fff;box-shadow:var(--shadow);cursor:pointer;font-size:18px;color:var(--ink);display:none;z-index:3}
.strip-nav:hover{background:var(--lime)}
.strip-nav.prev{inset-inline-start:-14px}.strip-nav.next{inset-inline-end:-14px}
@media(hover:hover) and (min-width:1000px){.strip-nav{display:grid;place-items:center}}
#view,#results{animation:fadeUp .28s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.skel{display:flex;gap:15px;overflow:hidden;padding:4px 2px}
.skel i{flex:none;width:var(--cw);aspect-ratio:100/141;border-radius:14px;background:linear-gradient(100deg,rgba(255,255,255,.55) 30%,rgba(255,255,255,.95) 50%,rgba(255,255,255,.55) 70%);background-size:200% 100%;animation:sh 1.2s linear infinite;border:1px solid var(--line)}
@keyframes sh{to{background-position:-200% 0}}
.search input{padding-inline-end:88px}
.search .clear{position:absolute;inset-inline-start:10px;top:10px;width:36px;height:36px;border:0;border-radius:50%;background:var(--paper);color:var(--muted);font-size:18px;cursor:pointer;display:none}
.search.has-q .clear{display:block}
@media(max-width:700px){
  .head-row{height:60px}
  .brand-mark{width:46px;height:36px}
  .menu-btn{display:none!important}
  .tabs{display:flex!important;flex-wrap:nowrap;justify-content:flex-start;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none;padding:0 12px 10px;margin-inline:0;width:100%;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 14px,#000 calc(100% - 14px),transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 14px,#000 calc(100% - 14px),transparent 100%)}
  .tabs::-webkit-scrollbar{display:none}
  .tab{scroll-snap-align:center;padding:8px 18px}
  .drawer{display:none!important}
  .to-top{bottom:calc(16px + env(safe-area-inset-bottom))}
}
@media(prefers-reduced-motion:reduce){#view,#results{animation:none}.skel i{animation:none}.card{transition:none}.card:hover,.card:active{transform:none}}

/* Brightness gradient top -> bottom (as in the Sunray reference) */
body{background:transparent}
html{background:#eceed4}
body::after{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;background:linear-gradient(180deg,#fefff7 0%,#f8f9eb 38%,#eef0d6 72%,#e3e7c3 100%)}
.site-head{background:linear-gradient(180deg,rgba(254,255,247,.96),rgba(248,249,235,.9))}
.name{padding-top:44px;background:linear-gradient(0deg,rgba(15,22,10,.8) 0%,rgba(15,22,10,.42) 48%,rgba(15,22,10,0) 100%)}
.media::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,0) 35%)}

/* nutrition facts on the card back */
.nutri{margin-top:8px}
.nutri h4{margin:0 0 6px;font-size:12px;font-weight:800;color:var(--green-dark)}
.nutri-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.nutri-grid div{background:rgba(127,129,65,.12);border-radius:10px;padding:6px 4px;text-align:center;line-height:1.15}
.nutri-grid b{display:block;font-size:16px;font-weight:900;color:var(--ink)}
.nutri-grid span{display:block;font-size:10.5px;font-weight:700;color:var(--muted)}
.nutri-grid small{font-size:9px;color:var(--muted)}
.nutri .nutri-empty{font-size:11.5px;margin:0}
/* day / night toggle */
.theme-btn svg{width:20px;height:20px}

/* Brand-colour frame around each product image (gradient ring, varies per card) */
.media::before{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;border-radius:10px;padding:4px;
  background:linear-gradient(135deg,#f37143 0%,#c9df81 52%,#84c58d 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.card:nth-child(4n+2) .media::before{background:linear-gradient(135deg,#84c58d 0%,#c9df81 50%,#7f8141 100%)}
.card:nth-child(4n+3) .media::before{background:linear-gradient(135deg,#c9df81 0%,#f37143 55%,#d6dcf0 100%)}
.card:nth-child(4n+4) .media::before{background:linear-gradient(135deg,#d6dcf0 0%,#84c58d 50%,#f37143 100%)}
html.no-pattern body::before{display:none}
html.no-frame .media::before{display:none}
.brand-logo{display:block;width:auto;max-width:180px;object-fit:contain}
.top-banner a{display:block}

/* ===== Calorie calculator ===== */
.price-row{position:relative}
.add-btn{position:absolute;inset-inline-end:2px;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:50%;border:0;background:var(--lime);color:#383838;font-size:22px;font-weight:800;line-height:1;cursor:pointer;display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.18);transition:transform .15s}
.add-btn:active{transform:translateY(-50%) scale(.88)}
.add-btn.pulse{animation:pop .4s ease}
@keyframes pop{50%{transform:translateY(-50%) scale(1.3);background:var(--accent);color:#fff}}
.calc-fab{position:fixed;inset-inline-start:16px;bottom:calc(72px + env(safe-area-inset-bottom));z-index:45;display:flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:12px 18px;background:#383838;color:#f8f9eb;font:800 14px inherit;box-shadow:var(--shadow);cursor:pointer}
.calc-fab svg{width:20px;height:20px}
.calc-fab b{background:var(--accent);color:#fff;border-radius:999px;min-width:22px;height:22px;padding:0 6px;display:grid;place-items:center;font-size:12px}
.calc-fab b:empty,.calc-fab b[data-n="0"]{display:none}
.calc-overlay{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.calc-overlay.open{opacity:1;pointer-events:auto}
.calc-panel{width:min(560px,100%);max-height:90vh;overflow:auto;background:var(--panel);color:var(--ink);border-radius:22px 22px 0 0;padding:16px 18px calc(22px + env(safe-area-inset-bottom));transform:translateY(24px);transition:transform .25s;box-shadow:0 -10px 40px rgba(0,0,0,.3)}
.calc-overlay.open .calc-panel{transform:none}
@media(min-width:700px){.calc-overlay{align-items:center}.calc-panel{border-radius:22px}}
.calc-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.calc-head h2{margin:0;font-size:20px}
.calc-close{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--ink);font-size:20px;cursor:pointer}
.calc-tabs{display:flex;gap:6px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:14px}
.calc-tabs button{flex:1;border:0;background:transparent;color:var(--ink);border-radius:10px;padding:10px;font:700 14px inherit;cursor:pointer}
.calc-tabs button.on{background:var(--green);color:#fff}
[data-theme=dark] .calc-tabs button.on{background:#c9df81;color:#383838}
.calc-list{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.calc-row{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:14px;padding:8px 10px}
.calc-row img,.calc-row .ph{width:44px;height:44px;border-radius:10px;object-fit:cover;flex:none;font-size:18px}
.calc-row .nm{flex:1;min-width:0;font-weight:700;font-size:14px;line-height:1.3}
.calc-row .nm small{display:block;color:var(--muted);font-weight:500;font-size:11.5px}
.calc-row .nm small.warn{color:var(--accent)}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--paper);color:var(--ink);font-size:16px;font-weight:800;cursor:pointer}
.qty span{min-width:18px;text-align:center;font-weight:800}
.calc-empty{text-align:center;color:var(--muted);padding:26px 8px;line-height:1.9}
.totals{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:6px 0 12px}
.totals div{background:rgba(127,129,65,.13);border-radius:12px;padding:10px 4px;text-align:center}
.totals b{display:block;font-size:20px;font-weight:900}
.totals span{font-size:11px;color:var(--muted);font-weight:700}
.totals .kcal{grid-column:1/-1;background:var(--green);color:#fff}
.totals .kcal span{color:rgba(255,255,255,.85)}
[data-theme=dark] .totals .kcal{background:#c9df81;color:#383838}
[data-theme=dark] .totals .kcal span{color:#383838}
.macro-bar{display:flex;height:12px;border-radius:99px;overflow:hidden;margin:4px 0 6px;background:var(--line)}
.macro-bar i{display:block;height:100%}
.macro-legend{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-bottom:12px}
.goal-bar{height:12px;border-radius:99px;background:var(--line);overflow:hidden;margin:6px 0}
.goal-bar i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .3s}
.goal-bar.over i{background:var(--accent)}
[data-theme=dark] .goal-bar i{background:#c9df81}
.calc-note{font-size:11.5px;color:var(--muted);line-height:1.8;margin:8px 0 0}
.calc-actions{display:flex;gap:8px;margin-top:8px}
.calc-btn{flex:1;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:12px;padding:11px;font:700 14px inherit;cursor:pointer}
.calc-btn.primary{background:var(--green);color:#fff;border-color:var(--green)}
[data-theme=dark] .calc-btn.primary{background:#c9df81;color:#383838;border-color:#c9df81}
.calc-form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.calc-form label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:700;color:var(--muted)}
.calc-form label.full{grid-column:1/-1}
.calc-form input,.calc-form select{height:46px;border:1px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);font:600 16px inherit;padding:0 12px;outline:none}
.calc-form input:focus,.calc-form select:focus{border-color:var(--green)}
.calc-result{margin-top:14px;border:1px solid var(--line);border-radius:16px;padding:14px}
.calc-result .big{font-size:30px;font-weight:900;color:var(--accent)}
.calc-result .row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px}
.calc-result .row:last-child{border:0}
</style>
</head>
<body>
  <div class="top-banner" id="topBanner" hidden><img id="topBannerImg" alt="" decoding="async" fetchpriority="high"></div>

  <header class="site-head" id="siteHead">
    <div class="shell head-row">
      <a class="brand" href="#/" aria-label="الرئيسية">
        <span class="brand-mark" role="img" aria-label="Prodiet"></span>
        <span class="brand-copy"><strong id="brandName">prodiet</strong><small id="brandTagline">HEALTHY FOOD</small></span>
      </a>
      <div class="head-actions">
        <button class="icon-btn theme-btn" type="button" id="themeButton" aria-label="تبديل النمط الليلي والنهاري"><svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
        <button class="icon-btn" type="button" id="langButton" aria-label="تغيير اللغة">EN</button>
        <button class="icon-btn menu-btn" type="button" id="menuButton" aria-label="التصنيفات" aria-expanded="false">☰</button>
      </div>
      <div class="drawer" id="drawer" hidden></div>
    </div>
    <nav class="shell tabs" id="tabs" aria-label="تصنيفات المنيو"></nav>
  </header>

  <main class="shell">
    <div class="search" id="searchWrap" hidden>
      <input id="search" type="search" placeholder="ابحث عن أي منتج في المنيو..." aria-label="بحث في المنيو" autocomplete="off" enterkeyhint="search" inputmode="search">
      <button class="clear" id="searchClear" type="button" aria-label="مسح البحث">×</button>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    </div>
    <div id="view"><div class="skel" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div></div>
    <div id="results" hidden></div>
  </main>

  <footer>
    <div class="shell foot">
      <strong id="footerBrand">prodiet</strong>
      <p id="footerTagline">توازن يصنع يومك.</p>
      <a href="tel:+966500000000" id="footerPhone">تواصل معنا</a>
      <small id="footerCopyright">© 2026 جميع الحقوق محفوظة</small>
    </div>
  </footer>


  <button class="calc-fab" id="calcFab" type="button" aria-haspopup="dialog" aria-controls="calcOverlay" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="2.5" width="16" height="19" rx="3"/><path d="M8 7h8M8 12h.01M12 12h.01M16 12h.01M8 16h.01M12 16h.01M16 16h.01"/></svg>
    <span id="calcFabText">حاسبة السعرات</span><b id="calcFabCount" data-n="0"></b>
  </button>
  <div class="calc-overlay" id="calcOverlay" aria-hidden="true">
    <div class="calc-panel" role="dialog" aria-modal="true" aria-labelledby="calcTitle">
      <div class="calc-head"><h2 id="calcTitle">حاسبة السعرات</h2><button class="calc-close" id="calcClose" type="button" aria-label="إغلاق">×</button></div>
      <div class="calc-tabs" role="tablist"><button type="button" class="on" data-ctab="meal" role="tab">وجبتي</button><button type="button" data-ctab="need" role="tab">احتياجي اليومي</button></div>
      <div id="calcMeal"></div>
      <div id="calcNeed" hidden></div>
    </div>
  </div>
  <button class="to-top" id="toTop" aria-label="العودة للأعلى">↑</button>

  <script>
const SUPABASE_URL = 'https://kzsofmkfublemcwtdplo.supabase.co';
const SUPABASE_KEY = 'sb_publishable_C1hlUynNCI-5TyswvLS3Ew_Xp3nr40i';
const headers = { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` };

const $ = id => document.getElementById(id);
let MENU = [];
let SITE = {};
let UI = {};
let CALC_ON = true;

function esc(value) {
  return String(value ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

async function loadMenu() {
  const [categoriesResponse, itemsResponse] = await Promise.all([
    fetch(`${SUPABASE_URL}/rest/v1/menu_categories?select=id,name_ar,icon,sort_order&is_active=eq.true&order=sort_order.asc,id.asc`, { headers }),
    fetch(`${SUPABASE_URL}/rest/v1/menu_items?select=id,category_id,name_ar,name_en,description_ar,details,price,badge_ar,image_url,calories,protein_g,carbs_g,fat_g,show_image,show_price,show_description,show_details,show_category,sort_order&is_active=eq.true&order=sort_order.asc,id.asc`, { headers })
  ]);
  if (!categoriesResponse.ok || !itemsResponse.ok) throw new Error('تعذر تحميل بيانات المنيو');
  const categories = await categoriesResponse.json();
  const items = await itemsResponse.json();
  return categories
    .map(category => ({
      id: category.id,
      name: category.name_ar,
      icon: category.icon || '',
      items: items.filter(item => item.category_id === category.id).map(item => ({
        id: item.id,
        categoryId: category.id,
        nutrition: { calories: item.calories, protein_g: item.protein_g, carbs_g: item.carbs_g, fat_g: item.fat_g },
        name: item.name_ar,
        nameEn: item.name_en || '',
        description: item.show_description !== false ? (item.description_ar || '') : '',
        details: item.show_details !== false ? (item.details || '') : '',
        price: item.show_price === false ? '' : Number(item.price).toString(),
        badge: item.badge_ar || '',
        image: item.show_image !== false ? (item.image_url || '') : '',
        categoryName: item.show_category !== false ? category.name_ar : '',
        icon: category.icon || ''
      }))
    }))
    .filter(category => category.items.length > 0);
}

async function loadSite() {
  const response = await fetch(`${SUPABASE_URL}/rest/v1/site_content?select=*&id=eq.1`, { headers });
  if (!response.ok) return {};
  return (await response.json())[0] || {};
}

function card(item) {
  const media = item.image
    ? `<img src="${esc(item.image)}" alt="${esc(item.name)}" loading="lazy" decoding="async" width="400" height="500">`
    : `<div class="ph" aria-hidden="true">${esc(item.icon)}</div>`;
  const price = item.price ? `<span class="num">${esc(item.price)}</span><span class="chip">ر.س</span>` : '';
  const facts = [['calories', 'سعرات حرارية', 'kcal'], ['protein_g', 'بروتين', 'جم'], ['carbs_g', 'كربوهيدرات', 'جم'], ['fat_g', 'دهون', 'جم']]
    .filter(([key]) => item.nutrition[key] !== null && item.nutrition[key] !== undefined && item.nutrition[key] !== '')
    .map(([key, label, unit]) => `<div><b>${esc(Number(item.nutrition[key]).toString())}</b><span>${label}</span><small>${unit}</small></div>`).join('');
  const back = `
      ${item.categoryName ? `<span class="cat">${esc(item.categoryName)}</span>` : ''}
      <h3>${esc(item.name)}</h3>
      ${item.description ? `<p>${esc(item.description)}</p>` : ''}
      ${item.details ? `<p>${esc(item.details)}</p>` : ''}
      <div class="nutri"><h4>المعلومات الغذائية</h4>${facts ? `<div class="nutri-grid">${facts}</div>` : `<p class="nutri-empty">لم تُضف المعلومات الغذائية لهذا المنتج بعد.</p>`}</div>
      ${item.price ? `<div class="price-back">${esc(item.price)} ر.س</div>` : ''}
      <div class="hint">اضغط للرجوع</div>`;
  return `<article class="card" tabindex="0" role="button" aria-pressed="false" aria-label="${esc(item.name)}">
    <div class="card-inner">
      <div class="face front">
        <div class="media">${media}
          ${item.badge ? `<span class="badge">${esc(item.badge)}</span>` : ''}
          ${item.nameEn ? `<span class="en-name">${esc(item.nameEn)}</span>` : ''}
          <div class="name">${esc(item.name)}</div>
        </div>
        <div class="price-row">${price}${CALC_ON ? `<button class="add-btn" type="button" data-add="${esc(item.id)}" aria-label="أضف ${esc(item.name)} إلى حاسبة السعرات" title="أضف إلى حاسبة السعرات">+</button>` : ''}</div>
      </div>
      <div class="face back">${back}</div>
    </div>
  </article>`;
}

document.addEventListener('click', event => {
  if (event.target.closest('.add-btn')) return;
  const target = event.target.closest('.card');
  if (!target) return;
  const flipped = target.classList.toggle('flipped');
  target.setAttribute('aria-pressed', String(flipped));
});
document.addEventListener('keydown', event => {
  if ((event.key === 'Enter' || event.key === ' ') && event.target.classList.contains('card')) {
    event.preventDefault();
    event.target.click();
  }
});

function currentRoute() {
  const hash = decodeURIComponent(location.hash.replace(/^#/, ''));
  const match = hash.match(/^\/c\/(.+)$/);
  return match ? { type: 'category', id: match[1] } : { type: 'home' };
}

function renderTabs(route) {
  const entries = [{ href: '#/', label: UI.home_tab_text || 'الرئيسية', active: route.type === 'home' }]
    .concat(MENU.map(category => ({ href: `#/c/${encodeURIComponent(category.id)}`, label: category.name, active: route.type === 'category' && route.id === category.id })));
  const html = entries.map(entry => `<a class="tab${entry.active ? ' active' : ''}" href="${entry.href}">${esc(entry.label)}</a>`).join('');
  $('tabs').innerHTML = html;
  $('drawer').innerHTML = html;
}

function renderHome() {
  const welcome = [];
  if (SITE.hero_eyebrow) welcome.push(`<span class="pill">${esc(SITE.hero_eyebrow)}</span>`);
  const title = [SITE.hero_title_line1, SITE.hero_title_line2].filter(Boolean).join(' ');
  if (title || SITE.hero_text) {
    welcome.push(`<div class="tag-card">${title ? `<h1>${esc(title)}</h1>` : ''}${SITE.hero_text ? `<p>${esc(SITE.hero_text)}</p>` : ''}</div>`);
  }
  const strips = [];
  const featured = MENU.flatMap(category => category.items).filter(item => item.badge);
  if (featured.length) {
    strips.push(`<section class="strip"><div class="strip-head"><h2>مميّز</h2></div><div class="scroller">${featured.map(card).join('')}</div><button class="strip-nav prev" type="button" aria-label="السابق">›</button><button class="strip-nav next" type="button" aria-label="التالي">‹</button></section>`);
  }
  MENU.forEach(category => {
    strips.push(`<section class="strip"><div class="strip-head"><h2>${esc(category.name)}</h2><a href="#/c/${encodeURIComponent(category.id)}">${esc(UI.viewall_text || 'عرض الكل')}</a></div><div class="scroller">${category.items.map(card).join('')}</div><button class="strip-nav prev" type="button" aria-label="السابق">›</button><button class="strip-nav next" type="button" aria-label="التالي">‹</button></section>`);
  });
  return `${welcome.length ? `<div class="welcome">${welcome.join('')}</div>` : ''}${strips.join('')}`;
}

function renderCategory(id) {
  const category = MENU.find(entry => entry.id === id);
  if (!category) return `<div class="empty"><b>القسم غير موجود</b><a class="pill" href="#/">العودة للرئيسية</a></div>`;
  return `<section class="cat-view"><h2>${esc(category.name)}</h2><div class="grid">${category.items.map(card).join('')}</div></section>`;
}

function route() {
  const current = currentRoute();
  closeDrawer();
  clearSearch();
  renderTabs(current);
  if (!MENU.length) {
    $('view').innerHTML = `<div class="empty"><b>المنيو قيد التحضير</b>سيتم إضافة التصنيفات والأطباق قريبًا.</div>`;
    return;
  }
  $('view').innerHTML = current.type === 'home' ? renderHome() : renderCategory(current.id);
  const key = location.hash || '#/';
  window.scrollTo(0, cameFromLink ? 0 : (scrollMemory[key] || 0));
  cameFromLink = false;
  const active = document.querySelector('#tabs .tab.active');
  if (active) active.scrollIntoView({ inline: 'center', block: 'nearest' });
}
history.scrollRestoration = 'manual';
const scrollMemory = {};
let cameFromLink = false;
document.addEventListener('click', event => { if (event.target.closest('a[href^="#/"]')) cameFromLink = true; }, true);
let scrollTick = 0;
window.addEventListener('scroll', () => { if (scrollTick) return; scrollTick = requestAnimationFrame(() => { scrollMemory[location.hash || '#/'] = scrollY; scrollTick = 0; }); }, { passive: true });
window.addEventListener('hashchange', route);

function clearSearch() {
  $('search').value = '';
  $('searchWrap').classList.remove('has-q');
  $('results').hidden = true;
  $('results').innerHTML = '';
  $('view').hidden = false;
}
let searchTimer = 0;
$('search').addEventListener('input', () => { $('searchWrap').classList.toggle('has-q', !!$('search').value); clearTimeout(searchTimer); searchTimer = setTimeout(runSearch, 120); });
$('searchClear').addEventListener('click', () => { clearSearch(); $('search').focus(); });
$('search').addEventListener('keydown', event => { if (event.key === 'Escape') clearSearch(); });
function runSearch() {
  const query = $('search').value.trim().toLowerCase();
  if (!query) { $('results').hidden = true; $('results').innerHTML = ''; $('view').hidden = false; return; }
  const matches = MENU.flatMap(category => category.items).filter(item => `${item.name} ${item.nameEn} ${item.description}`.toLowerCase().includes(query));
  $('view').hidden = true;
  $('results').hidden = false;
  $('results').innerHTML = matches.length
    ? `<section class="cat-view"><h2>نتائج البحث (${matches.length})</h2><div class="grid">${matches.map(card).join('')}</div></section>`
    : `<div class="empty"><b>لا توجد نتائج مطابقة</b>جرّب كلمة أخرى.</div>`;
}

function closeDrawer() { $('drawer').hidden = true; $('menuButton').setAttribute('aria-expanded', 'false'); }
$('menuButton').addEventListener('click', event => {
  event.stopPropagation();
  $('drawer').hidden = !$('drawer').hidden;
  $('menuButton').setAttribute('aria-expanded', String(!$('drawer').hidden));
});
document.addEventListener('click', event => { if (!event.target.closest('#drawer')) closeDrawer(); });
$('langButton').addEventListener('click', () => alert('يمكن إضافة النسخة الإنجليزية من لوحة الإدارة لاحقًا.'));
const toTop = $('toTop');
window.addEventListener('scroll', () => toTop.classList.toggle('show', scrollY > 500), { passive: true });
toTop.addEventListener('click', () => scrollTo({ top: 0, behavior: 'smooth' }));

function applyText(id, value) {
  if (value === null || value === undefined) return;
  const element = $(id);
  if (value === '') { element.style.display = 'none'; return; }
  element.textContent = value;
}
function applySite() {
  applyText('brandName', SITE.brand_name);
  applyText('brandTagline', SITE.brand_tagline);
  applyText('footerBrand', SITE.brand_name);
  applyText('footerTagline', SITE.footer_tagline);
  applyText('footerCopyright', SITE.footer_copyright);
  if (SITE.footer_phone) $('footerPhone').href = `tel:${SITE.footer_phone}`;
}


document.addEventListener('click', event => {
  const nav = event.target.closest('.strip-nav');
  if (!nav) return;
  const scroller = nav.parentElement.querySelector('.scroller');
  const dir = nav.classList.contains('next') ? 1 : -1;
  // RTL: scrollLeft is negative and grows toward the "next" (left) side
  scroller.scrollBy({ left: -dir * Math.round(scroller.clientWidth * 0.85), behavior: 'smooth' });
});


const themeMeta = document.getElementById('themeColor');
function applyTheme(theme) {
  document.documentElement.dataset.theme = theme;
  if (themeMeta) themeMeta.content = theme === 'dark' ? '#000000' : '#f8f9eb';
  $('themeButton').setAttribute('aria-pressed', String(theme === 'dark'));
}
applyTheme(document.documentElement.dataset.theme || 'light');
$('themeButton').addEventListener('click', () => {
  const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  applyTheme(next);
  try { localStorage.setItem('pd-theme', next); } catch (error) {}
});

function darken(hex, amount) {
  const n = parseInt(hex.slice(1), 16);
  const f = v => Math.max(0, Math.round(v * (1 - amount))).toString(16).padStart(2, '0');
  return '#' + f((n >> 16) & 255) + f((n >> 8) & 255) + f(n & 255);
}
function applyUI() {
  const root = document.documentElement;
  const hexOk = value => /^#[0-9a-fA-F]{6}$/.test(value || '');
  if (hexOk(UI.color_primary)) { root.style.setProperty('--green', UI.color_primary); root.style.setProperty('--green-dark', darken(UI.color_primary, .25)); }
  if (hexOk(UI.color_accent)) root.style.setProperty('--accent', UI.color_accent);
  root.classList.toggle('no-pattern', UI.pattern_show === false);
  root.classList.toggle('no-frame', UI.frame_show === false);
  // logo
  const mark = document.querySelector('.brand-mark');
  if (UI.logo_show === false) mark.style.display = 'none';
  const h = Number(UI.logo_height) || 0;
  if (UI.logo_url) {
    const img = document.createElement('img');
    img.className = 'brand-logo'; img.alt = ''; img.src = UI.logo_url; img.style.height = (h || 44) + 'px';
    mark.style.display = 'none'; mark.after(img);
    if (UI.logo_show === false) img.style.display = 'none';
  } else if (h) {
    mark.style.setProperty('height', h + 'px', 'important'); mark.style.setProperty('width', Math.round(h * 1.28) + 'px', 'important');
  }
  // favicon
  if (UI.favicon_url) {
    let link = document.querySelector('link[rel="icon"]');
    if (!link) { link = document.createElement('link'); link.rel = 'icon'; document.head.appendChild(link); }
    link.href = UI.favicon_url;
  }
  // banner placement, height, fit, link
  const banner = $('topBanner');
  if (UI.banner_position === 'below_header') $('siteHead').after(banner);
  if (UI.banner_position === 'hidden') banner.dataset.off = '1';
  const bannerImg = $('topBannerImg');
  if (Number(UI.banner_height) > 0) { bannerImg.style.height = Number(UI.banner_height) + 'px'; bannerImg.style.maxHeight = 'none'; }
  if (UI.banner_fit === 'contain') bannerImg.style.objectFit = 'contain';
  if (UI.banner_link && /^https?:\/\//i.test(UI.banner_link)) {
    const anchor = document.createElement('a'); anchor.href = UI.banner_link; anchor.target = '_blank'; anchor.rel = 'noopener';
    bannerImg.replaceWith(anchor); anchor.appendChild(bannerImg);
  }
  // buttons
  if (UI.lang_show === false) $('langButton').style.display = 'none';
  if (UI.lang_text) $('langButton').textContent = UI.lang_text;
  if (UI.theme_show === false) $('themeButton').style.display = 'none';
  if (UI.search_placeholder) $('search').placeholder = UI.search_placeholder;
  if (UI.totop_show === false) $('toTop').style.display = 'none';
  if (UI.footer_phone_show === false) $('footerPhone').style.display = 'none';
  else if (UI.footer_phone_text) $('footerPhone').textContent = UI.footer_phone_text;
  // default theme for first-time visitors
  let saved = null; try { saved = localStorage.getItem('pd-theme'); } catch (error) {}
  if (!saved && (UI.theme_default === 'light' || UI.theme_default === 'dark')) applyTheme(UI.theme_default);
}

/* ===== Calorie calculator ===== */
const PLATE_KEY = 'pd-plate', PROFILE_KEY = 'pd-profile';
let plate = {}, profile = {};
try { plate = JSON.parse(localStorage.getItem(PLATE_KEY) || '{}') || {}; profile = JSON.parse(localStorage.getItem(PROFILE_KEY) || '{}') || {}; } catch (error) {}
const savePlate = () => { try { localStorage.setItem(PLATE_KEY, JSON.stringify(plate)); } catch (error) {} };
const saveProfile = () => { try { localStorage.setItem(PROFILE_KEY, JSON.stringify(profile)); } catch (error) {} };
const num = value => (value === null || value === undefined || value === '' || isNaN(Number(value))) ? null : Number(value);
const round1 = value => Math.round(value * 10) / 10;
function itemById(id) { for (const category of MENU) for (const item of category.items) if (String(item.id) === String(id)) return item; return null; }
function plateTotals() {
  const total = { calories: 0, protein_g: 0, carbs_g: 0, fat_g: 0 };
  let missing = 0, count = 0;
  Object.entries(plate).forEach(([id, qty]) => {
    const item = itemById(id); if (!item) return;
    count += qty;
    const n = item.nutrition;
    if (num(n.calories) === null) { missing += 1; return; }
    Object.keys(total).forEach(key => { total[key] += (num(n[key]) || 0) * qty; });
  });
  return { total, missing, count };
}
function renderFab() {
  const { count } = plateTotals();
  $('calcFabCount').textContent = count || '';
  $('calcFabCount').dataset.n = String(count);
}
function goalKcal() {
  const p = profile;
  const age = num(p.age), weight = num(p.weight), height = num(p.height);
  if (!age || !weight || !height) return null;
  const bmr = 10 * weight + 6.25 * height - 5 * age + (p.gender === 'female' ? -161 : 5);
  const factor = { '1.2': 1.2, '1.375': 1.375, '1.55': 1.55, '1.725': 1.725, '1.9': 1.9 }[p.activity] || 1.375;
  const tdee = bmr * factor;
  const adjust = p.goal === 'lose' ? -500 : p.goal === 'gain' ? 300 : 0;
  const floor = p.gender === 'female' ? 1200 : 1500;
  const target = Math.max(floor, tdee + adjust);
  const bmi = weight / Math.pow(height / 100, 2);
  return { bmr, tdee, target, bmi };
}
function bmiLabel(bmi) { return bmi < 18.5 ? 'نحافة' : bmi < 25 ? 'وزن طبيعي' : bmi < 30 ? 'وزن زائد' : 'سمنة'; }
function renderMeal() {
  const { total, missing, count } = plateTotals();
  const rows = Object.entries(plate).map(([id, qty]) => {
    const item = itemById(id); if (!item) return '';
    const kcal = num(item.nutrition.calories);
    const img = item.image ? `<img src="${esc(item.image)}" alt="" loading="lazy" decoding="async">` : `<div class="ph" aria-hidden="true">${esc(item.icon)}</div>`;
    return `<div class="calc-row">${img}<div class="nm">${esc(item.name)}<small class="${kcal === null ? 'warn' : ''}">${kcal === null ? 'لا توجد بيانات غذائية — غير محسوب' : `${esc(String(kcal))} kcal للواحد`}</small></div>
      <div class="qty"><button type="button" data-q="-1" data-id="${esc(id)}" aria-label="إنقاص">−</button><span>${qty}</span><button type="button" data-q="1" data-id="${esc(id)}" aria-label="زيادة">+</button></div></div>`;
  }).join('');
  if (!rows) { $('calcMeal').innerHTML = `<div class="calc-empty"><b>وجبتك فارغة</b><br>اضغط زر «+» الموجود على أي منتج لإضافته وحساب سعراته.</div>`; return; }
  const kcalFromMacros = total.protein_g * 4 + total.carbs_g * 4 + total.fat_g * 9;
  const pct = value => kcalFromMacros ? Math.round(value / kcalFromMacros * 100) : 0;
  const pP = pct(total.protein_g * 4), pC = pct(total.carbs_g * 4), pF = kcalFromMacros ? Math.max(0, 100 - pP - pC) : 0;
  const goal = goalKcal();
  const goalHtml = goal ? (() => {
    const ratio = total.calories / goal.target, left = goal.target - total.calories;
    return `<div><b>${Math.round(total.calories)}</b> من هدفك <b>${Math.round(goal.target)}</b> kcal يوميًا (${Math.round(ratio * 100)}%)</div>
      <div class="goal-bar ${ratio > 1 ? 'over' : ''}"><i style="width:${Math.min(100, ratio * 100)}%"></i></div>
      <div class="calc-note">${left >= 0 ? `المتبقي لهذا اليوم: ${Math.round(left)} kcal` : `تجاوزت هدفك بمقدار ${Math.round(-left)} kcal`}</div>`;
  })() : `<div class="calc-note">أدخل بياناتك في تبويب «احتياجي اليومي» لمقارنة وجبتك بهدفك.</div>`;
  $('calcMeal').innerHTML = `<div class="calc-list">${rows}</div>
    <div class="totals"><div class="kcal"><b>${Math.round(total.calories)}</b><span>سعرة حرارية (kcal) — ${count} صنف</span></div>
      <div><b>${round1(total.protein_g)}</b><span>بروتين جم</span></div><div><b>${round1(total.carbs_g)}</b><span>كربوهيدرات جم</span></div><div><b>${round1(total.fat_g)}</b><span>دهون جم</span></div></div>
    ${kcalFromMacros ? `<div class="macro-bar" aria-hidden="true"><i style="width:${pP}%;background:#84c58d"></i><i style="width:${pC}%;background:#c9df81"></i><i style="width:${pF}%;background:#f37143"></i></div>
    <div class="macro-legend"><span>🟢 بروتين ${pP}%</span><span>🟡 كربوهيدرات ${pC}%</span><span>🟠 دهون ${pF}%</span></div>` : ''}
    ${missing ? `<div class="calc-note" style="color:var(--accent)">${missing} صنف بلا بيانات غذائية، لذلك لم يُحتسب.</div>` : ''}
    ${goalHtml}
    <div class="calc-actions"><button class="calc-btn" type="button" id="calcClear">تفريغ الوجبة</button><button class="calc-btn primary" type="button" id="calcToNeed">احسب احتياجي اليومي</button></div>
    <p class="calc-note">الأرقام تقريبية وتعتمد على البيانات المدخلة لكل منتج.</p>`;
}
function renderNeed() {
  const p = profile, g = goalKcal();
  const sel = (value, current) => value === current ? ' selected' : '';
  $('calcNeed').innerHTML = `<form class="calc-form" id="needForm" novalidate>
      <label>الجنس<select id="pGender"><option value="male"${sel('male', p.gender || 'male')}>ذكر</option><option value="female"${sel('female', p.gender)}>أنثى</option></select></label>
      <label>العمر (سنة)<input id="pAge" type="number" inputmode="numeric" min="10" max="100" value="${esc(p.age || '')}"></label>
      <label>الوزن (كجم)<input id="pWeight" type="number" inputmode="decimal" min="30" max="300" step="0.1" value="${esc(p.weight || '')}"></label>
      <label>الطول (سم)<input id="pHeight" type="number" inputmode="numeric" min="120" max="230" value="${esc(p.height || '')}"></label>
      <label class="full">مستوى النشاط<select id="pActivity">
        <option value="1.2"${sel('1.2', p.activity)}>قليل الحركة (عمل مكتبي)</option><option value="1.375"${sel('1.375', p.activity || '1.375')}>نشاط خفيف (1–3 أيام رياضة)</option>
        <option value="1.55"${sel('1.55', p.activity)}>نشاط متوسط (3–5 أيام)</option><option value="1.725"${sel('1.725', p.activity)}>نشاط عالٍ (6–7 أيام)</option><option value="1.9"${sel('1.9', p.activity)}>نشاط شديد (رياضي/عمل بدني)</option></select></label>
      <label class="full">هدفك<select id="pGoal"><option value="lose"${sel('lose', p.goal)}>إنقاص الوزن</option><option value="maintain"${sel('maintain', p.goal || 'maintain')}>تثبيت الوزن</option><option value="gain"${sel('gain', p.goal)}>زيادة الوزن</option></select></label>
    </form>
    <div id="needResult">${g ? needResultHtml(g) : '<div class="calc-note">أدخل العمر والوزن والطول لحساب احتياجك.</div>'}</div>
    <p class="calc-note">المعادلة المستخدمة: Mifflin-St Jeor. الأرقام تقديرية وليست بديلًا عن استشارة مختص تغذية.</p>`;
}
function needResultHtml(g) {
  return `<div class="calc-result"><div>هدفك اليومي</div><div class="big">${Math.round(g.target)} <small>kcal</small></div>
    <div class="row"><span>معدل الحرق الأساسي (BMR)</span><b>${Math.round(g.bmr)} kcal</b></div>
    <div class="row"><span>احتياجك مع النشاط (TDEE)</span><b>${Math.round(g.tdee)} kcal</b></div>
    <div class="row"><span>مؤشر كتلة الجسم (BMI)</span><b>${round1(g.bmi)} — ${bmiLabel(g.bmi)}</b></div></div>`;
}
function readProfile() {
  profile = { gender: $('pGender').value, age: $('pAge').value, weight: $('pWeight').value, height: $('pHeight').value, activity: $('pActivity').value, goal: $('pGoal').value };
  saveProfile();
  const g = goalKcal();
  $('needResult').innerHTML = g ? needResultHtml(g) : '<div class="calc-note">أدخل العمر والوزن والطول لحساب احتياجك.</div>';
}
let lastFocus = null;
function openCalc(tab) {
  lastFocus = document.activeElement;
  $('calcOverlay').classList.add('open'); $('calcOverlay').setAttribute('aria-hidden', 'false');
  document.body.style.overflow = 'hidden';
  showCalcTab(tab || 'meal');
  $('calcClose').focus();
}
function closeCalc() {
  $('calcOverlay').classList.remove('open'); $('calcOverlay').setAttribute('aria-hidden', 'true');
  document.body.style.overflow = '';
  if (lastFocus && lastFocus.focus) lastFocus.focus();
}
function showCalcTab(tab) {
  document.querySelectorAll('[data-ctab]').forEach(button => { const on = button.dataset.ctab === tab; button.classList.toggle('on', on); button.setAttribute('aria-selected', String(on)); });
  $('calcMeal').hidden = tab !== 'meal'; $('calcNeed').hidden = tab !== 'need';
  if (tab === 'meal') renderMeal(); else renderNeed();
}
document.addEventListener('click', event => {
  const add = event.target.closest('.add-btn');
  if (add) {
    event.stopPropagation();
    const id = add.dataset.add; plate[id] = (plate[id] || 0) + 1; savePlate(); renderFab();
    add.classList.remove('pulse'); void add.offsetWidth; add.classList.add('pulse');
    return;
  }
  const q = event.target.closest('[data-q]');
  if (q) {
    const id = q.dataset.id; plate[id] = (plate[id] || 0) + Number(q.dataset.q);
    if (plate[id] <= 0) delete plate[id];
    savePlate(); renderFab(); renderMeal(); return;
  }
  if (event.target.closest('#calcClear')) { plate = {}; savePlate(); renderFab(); renderMeal(); return; }
  if (event.target.closest('#calcToNeed')) { showCalcTab('need'); return; }
  const tab = event.target.closest('[data-ctab]'); if (tab) { showCalcTab(tab.dataset.ctab); return; }
  if (event.target === $('calcOverlay') || event.target.closest('#calcClose')) closeCalc();
});
document.addEventListener('input', event => { if (event.target.closest('#needForm')) readProfile(); });
document.addEventListener('change', event => { if (event.target.closest('#needForm')) readProfile(); });
document.addEventListener('keydown', event => { if (event.key === 'Escape' && $('calcOverlay').classList.contains('open')) closeCalc(); });
$('calcFab').addEventListener('click', () => openCalc('meal'));

Promise.all([loadMenu().catch(error => { console.warn(error); return []; }), loadSite().catch(() => ({}))]).then(([menu, site]) => {
  MENU = menu;
  SITE = site;
  UI = (SITE && typeof SITE.ui === 'object' && SITE.ui) || {};
  CALC_ON = UI.calc_show !== false;
  applySite();
  applyUI();
  if (CALC_ON) { $('calcFab').hidden = false; if (UI.calc_text) $('calcFabText').textContent = UI.calc_text; if (UI.calc_text) $('calcTitle').textContent = UI.calc_text; renderFab(); }
  $('searchWrap').hidden = !MENU.length || UI.search_show === false;
  if (SITE.hero_image_url && UI.banner_position !== 'hidden') { $('topBannerImg').src = SITE.hero_image_url; $('topBanner').hidden = false; }
  route();
});
  </script>
</body>
